# Alembic configuration for the busca-voos Medallion schema.
# The database URL is NOT stored here (architecture.md §5: no connection string
# in source). ``migrations/env.py`` resolves it from the environment via
# ``persistence.db.build_database_url``.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Timezone-aware, sortable revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
